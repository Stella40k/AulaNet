<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Please Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- From Uiverse.io by MikeAndrewDesigner --> 
<div class="login wrap" id="formulario">
  <div class="h1">Registrarse</div>
  <input pattern="^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$" placeholder="Nombre" id="nombre" name="nombre" type="text">
  <input placeholder="Apellido" id="apellido" name="apellido" type="text">
  <input pattern="^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$" placeholder="Email" id="email" name="email" type="email">
  <input placeholder="Contraseña" id="contraseña" name="contraseña" type="password">
  <input pattern="^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$" placeholder="Role" id="role" name="role" type="text">
  <input placeholder="Genero" id="genero" name="genero" type="checkbox">
  <input pattern="^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$" placeholder="DNI" id="dni" name="dni" type="number">
  <input placeholder="Domicilio" id="domicilio" name="domicilio" type="text">
  <input pattern="^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$" placeholder="Traslado" id="traslado" name="traslado" type="checkbox">
  <input placeholder="Año" id="año" name="año" type="number">
  <input pattern="^([a-zA-Z0-9_\-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([a-zA-Z0-9\-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$" placeholder="Curso" id="curso" name="curso" type="text">
  <input placeholder="Telefono" id="telefono" name="telefono" type="tel">
  <input value="Crear" class="btn" type="submit">
</div>
<script src="script.js"></script>
</body>
</html>
