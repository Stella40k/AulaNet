<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
      <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<!-- From Uiverse.io by andrew-demchenk0 --> 
<div class="wrapper">
         <div class="card-switch">
            <label class="switch">
               <input type="checkbox" class="toggle">
               <span class="slider"></span>
               <span class="card-side"></span>
               <div class="flip-card__inner">
                  <div class="flip-card__front">
                     <div class="title">Abrir sesión</div>
                     <form class="flip-card__form" action="perfil.html">
                        <input class="flip-card__input" name="email" placeholder="Correo electrónico/Usuario" type="email">
                        <input class="flip-card__input" name="password" placeholder="Contraseña" type="password">
                        <button type="submit" class="flip-card__btn">Continuar</button>
                     </form>
                  </div>
                  <div class="flip-card__back">
                     <div class="title">Registrarse</div>
                     <form class="flip-card__form" action="">
                        <input class="flip-card__input" placeholder="Nombre" type="name" id="nombre">
                        <input class="flip-card__input" placeholder="Apellido" type="apellido" id="apellido">
                        <input class="flip-card__input" placeholder="DNI" type="dni" id="dni">
                        <input class="flip-card__input" placeholder="Género" type="genero" id="genero">
                        <input class="flip-card__input" placeholder="Domicilio" type="domicilio" id="domicilio">
                        <input class="flip-card__input" name="email" placeholder="Email" type="email" id="email">
                        <input class="flip-card__input" name="password" placeholder="Contraseña" type="password" id="contraseña">
                        <button class="flip-card__btn">Continuar</button>
                     </form>
                  </div>
               </div>
            </label>
         </div>   
   </div>
</div>
</body>
</html>
