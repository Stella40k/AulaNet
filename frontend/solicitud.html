<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de documento</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/estilosoli.css">
</head>
<body>
        <main class="container">
        <header class="nav-bar0 nav-bar0">
            <nav class="navbar navbar-expand-lg body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="perfil.html">
                        <img src="assets/images/snoopy.jfif" alt="Logo" width="30" height="30" class="d-inline-block align-text-top">
                        AulaNet
                    </a>
                      <ul class="nav nav-tabs">
                          <li class="nav-item">
                              <a class="nav-link active" aria-current="page" href="tablon.html">Tablón</a>
                          </li>
                          <li class="nav-item">
                              <a class="nav-link text-dark" href="perfil.html">Perfil</a>
                          </li>
                      </ul>
                    </div>
        </header>
<!-- Tablón -->
    <div class="container-fluid mt-5">
        <div class="row">
    <div class="container">
        <div class="form-container">
            <h2>Solicitar Documento</h2>
            <form id="formSolicitud">>
                <div class="mb-3">
                    <label for="nombreAlumno" class="form-label">Nombre del Alumno:</label>
                    <input type="text" class="form-control" id="nombreAlumno" placeholder="Nombre completo del alumno" required>
                </div>
                <div class="mb-3">
                    <label for="cursoAlumno" class="form-label">Curso:</label>
                    <input type="text" class="form-control" id="cursoAlumno" placeholder="Ej: 3º A - 2025" required>
                </div>
                <div class="mb-3">
                    <label for="tipoDocumento" class="form-label">Tipo de Documento Requerido:</label>
                    <select class="form-select" id="tipoDocumento" required>
                        <option selected disabled value="">Seleccione...</option>
                        <option>Certificado de Alumno Regular</option>
                        <option>Analítico Parcial</option>
                        <option>Analítico Final</option>
                        <option>Constancia de Cuil</option>
                        <option>Otro (especificar)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="motivo" class="form-label">Motivo de la Solicitud:</label>
                    <textarea class="form-control" id="motivo" rows="3" placeholder="Ej: Para presentar en la universidad, para trámite de beca, etc." required></textarea>
                </div>
                <div class="mb-3">
                    <label for="observaciones" class="form-label">Observaciones (opcional):</label>
                    <textarea class="form-control" id="observaciones" rows="2" placeholder="Cualquier información adicional relevante"></textarea>
                </div>
                <div class="mb-3">
                    <label for="fechaNecesidad" class="form-label">Fecha Límite (si aplica):</label>
                    <input type="date" class="form-control" id="fechaNecesidad">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-submit-form">Enviar Solicitud</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
       document.getElementById("formSolicitud").addEventListener("submit", function(event) {
        event.preventDefault(); // evita el envío real
        alert("¡La solicitud fue enviada correctamente!");
        this.reset(); // limpia los campos del formulario
    });
    </script> 
</body>
</html>
