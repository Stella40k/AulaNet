<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de documento</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/css/estilosoli.css">
</head>
<body>
    <form class="row g-3">
  <div class="col-md-6">
    <label for="inputEmail4" class="form-label">Nombre del Alumno</label>
    <input type="Juan Perez" class="form-control" id="inputEmail4">
  </div>
  <div class="col-md-6">
    <label for="inputPassword4" class="form-label">Curso del alumno</label>
    <input type="password" class="form-control" id="inputPassword4">
  </div>
  <div class="col-md-4">
    <label for="inputState" class="form-label">Documento solicitado</label>
    <select id="inputState" class="form-select">
      <option selected>Selecciona</option>
      <option>Certificado de Alumno Regular</option>
      <option>Analítico Parcial</option>
      <option>Analítico Final</option>
      <option>Otro (Específicar)</option>
    </select>
  </div>
  <div class="col-md-2">
    <label for="inputZip" class="form-label">Motivo de la Solicitud</label>
    <input type="Ej: Presentar en la Universidad, Trámite de Beca, etc." class="form-control" id="inputZip">
  </div>
                  <div class="col-12">
                    <label for="fechaNecesidad" class="form-label">Fecha Límite (si aplica):</label>
                    <input type="date" class="form-control" id="fechaNecesidad">
                </div>
      </label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
  </div>
</form>
</body>
</html>
